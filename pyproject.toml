[build-system]
requires = ["hatchling >= 1.27, <2"]
build-backend = "hatchling.build"


[project]
name = "markdown-images-migration"
description = "Project does image migration to specified cloud service for a markdown file"
authors = [
  { name="Julia Bespechnaya", email="julia.bespechnaya@gmail.com" },
]

dynamic = ["version"]

requires-python = ">=3.9"

dependencies = [
    "requests>=2.28",
]

readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

keywords = ["markdown", "image migration", "cloud service", "ImgBB"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English"
]

[project.optional-dependencies]
dev = ["pytest"]


[project.urls]
Homepage = "https://github.com/julia-bespechnaya/markdown-images-migration"
"Issue Tracker" = "https://github.com/julia-bespechnaya/markdown-images-migration/issues"


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
